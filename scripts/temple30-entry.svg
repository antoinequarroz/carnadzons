<!-- Insert as the final child of #egypt-frame, before the existing inscription group.
     Set #egypt-frame { fill: url(#temple30-gold); }.
     Every overlay remains inside the exact accepted temple silhouette. -->
<g class="temple30-frame-relief" stroke="none">
  <!-- Wide cornice: lit top, broad front face, shaded underside. -->
  <path d="M120 119H480L475.7 126H124.3Z" fill="url(#temple30-cap)"/>
  <path d="M128 132H472L463 137H137Z" fill="#A37435"/>
  <path d="M137 132H463V145H137Z" fill="url(#temple30-front)"/>
  <path d="M137 145H463V150H137Z" fill="#8B602D"/>
  <path d="M124.3 126H475.7L472 132H128Z" fill="#C6964A"/>
  <path d="M137.5 132.5H462.5M139 145H461" fill="none" stroke="#FFE4A6" stroke-width=".8" opacity=".72"/>

  <!-- The left jamb takes the warm key light. Its inner edge falls into the doorway. -->
  <path d="M148 150H205L198 157H155Z" fill="#FFE1A0"/>
  <path d="M148 150L155 157L131 352L120 360Z" fill="#F1CA85"/>
  <path d="M155 157H198V352H131Z" fill="url(#temple30-front)"/>
  <path d="M205 150V360L198 352V157Z" fill="#79552C"/>
  <path d="M155.5 157.5H197.5M155.5 157.5 131.7 351.5" fill="none" stroke="#FFE7B2" stroke-width=".9" opacity=".67"/>
  <path d="M197.4 158V351" fill="none" stroke="#B4823C" stroke-width="1"/>

  <!-- The right jamb has a lit inner bevel and a darker outer return. -->
  <path d="M395 150H452L445 157H402Z" fill="#F9D18B"/>
  <path d="M395 150V360L402 352V157Z" fill="#E7B968"/>
  <path d="M402 157H445L469 352H402Z" fill="url(#temple30-front)"/>
  <path d="M452 150 480 360 469 352 445 157Z" fill="#91632D"/>
  <path d="M402.5 157.5H444.4M402.5 157.5V351" fill="none" stroke="#FFE2A0" stroke-width=".8" opacity=".65"/>
  <path d="M445 158 468.7 351" fill="none" stroke="#A37234" stroke-width=".9"/>

  <!-- Narrow raised plinths, preserving the exact foot outlines. -->
  <path d="M113 352H205V357H112.2Z" fill="#F8D18C"/>
  <path d="M112.2 357H205V365H111Z" fill="#B58642"/>
  <path d="M395 352H487L487.8 357H395Z" fill="#E5BD76"/>
  <path d="M395 357H487.8L489 365H395Z" fill="#92642E"/>
  <path d="M113 352.5H204M396 352.5H487" fill="none" stroke="#FFE8AF" stroke-width=".8" opacity=".7"/>
  <path d="M111 364.5H205M395 364.5H489" fill="none" stroke="#6E4D27" stroke-width=".8"/>

  <!-- Shallow curved threshold: a thin highlighted lip, not an added staircase. -->
  <path d="M91 375C151 353 222 342 300 342C378 342 449 353 509 375C441 360 372 353 300 353C228 353 159 360 91 375Z" transform="translate(0 19)" fill="url(#temple30-threshold)"/>
  <path d="M106 389.1C162 370 229 361 300 361C371 361 438 370 494 389.1" fill="none" stroke="#FFE0A0" stroke-width=".9" opacity=".72"/>
</g>


<svg class="entry-world" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"><defs><!-- Insert these children in .entry-world > defs. Original 600 × 400 temple coordinates. -->
<linearGradient id="temple30-gold" gradientUnits="userSpaceOnUse" x1="134" y1="120" x2="461" y2="367">
  <stop stop-color="#FFDC92"/>
  <stop offset=".28" stop-color="#F6C66E"/>
  <stop offset=".51" stop-color="#DBAD58"/>
  <stop offset=".75" stop-color="#F1C674"/>
  <stop offset="1" stop-color="#B88339"/>
</linearGradient>
<linearGradient id="temple30-front" gradientUnits="userSpaceOnUse" x1="135" y1="150" x2="449" y2="351">
  <stop stop-color="#EAC078"/>
  <stop offset=".45" stop-color="#FFCF7A"/>
  <stop offset=".78" stop-color="#D8A957"/>
  <stop offset="1" stop-color="#B58240"/>
</linearGradient>
<linearGradient id="temple30-cap" gradientUnits="userSpaceOnUse" x1="120" y1="119" x2="480" y2="132">
  <stop stop-color="#FFE8AF"/>
  <stop offset=".43" stop-color="#FFD48A"/>
  <stop offset="1" stop-color="#D9A956"/>
</linearGradient>
<linearGradient id="temple30-threshold" gradientUnits="userSpaceOnUse" x1="300" y1="352" x2="300" y2="394">
  <stop stop-color="#FAD187"/>
  <stop offset=".32" stop-color="#C29450"/>
  <stop offset=".68" stop-color="#91652F"/>
  <stop offset="1" stop-color="#E4B96D"/>
</linearGradient>
<!-- A restrained dark stone body, distinct from the #0D1215 wall. Set the polygon's fill with a CSS selector because .door-panel currently defines fill. -->
<linearGradient id="temple30-leaf-stone" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#26302E"/>
  <stop offset=".24" stop-color="#192321"/>
  <stop offset=".64" stop-color="#10191A"/>
  <stop offset="1" stop-color="#080F13"/>
</linearGradient>
<linearGradient id="temple30-leaf-metal" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#FFE1A0"/>
  <stop offset=".44" stop-color="#C19755"/>
  <stop offset="1" stop-color="#6A4C28"/>
</linearGradient>
<pattern id="temple30-glyph-lines" width="720" height="720" patternUnits="userSpaceOnUse"><use href="#incisions" stroke="#ffcb71" stroke-width="1.1" opacity=".8"/></pattern>
<pattern id="temple30-door-incisions" width="720" height="720" patternUnits="userSpaceOnUse"><use href="#incisions" transform="translate(.8 .9)" stroke="#52604f" stroke-width="1" opacity=".4"/><use href="#incisions" stroke="#040a0d" stroke-width="1.5" opacity=".8"/></pattern>
<radialGradient id="temple30-light-falloff"><stop stop-color="white"/><stop offset=".35" stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
<mask id="temple30-ambient-mask" maskUnits="userSpaceOnUse"><circle class="temple30-ambient-focus" fill="url(#temple30-light-falloff)"/></mask>
<mask id="temple30-pointer-mask" maskUnits="userSpaceOnUse"><circle class="temple30-pointer-focus" fill="url(#temple30-light-falloff)"/></mask>
    <!-- temple30-incisions -->
<clipPath id="date-clip-left" clipPathUnits="userSpaceOnUse"><polygon class="date-clip-polygon-left"/></clipPath><clipPath id="date-clip-right" clipPathUnits="userSpaceOnUse"><polygon class="date-clip-polygon-right"/></clipPath><pattern id="stone-carving" width="720" height="720" patternUnits="userSpaceOnUse"><rect width="720" height="720" fill="#0D1215"/>  <use href="#incisions" transform="translate(1.05 1.25)" stroke="#293236" stroke-width="1.35" opacity=".64"/>
  <use href="#incisions" stroke="#070C0F" stroke-width="1.65" opacity=".96"/>
</pattern></defs><g class="portal"><path class="black-field" d="M-20000-20000H20000V20000H-20000Z M205 150V360H395V150Z" fill-rule="evenodd"/><path class="temple30-ambient-light" d="M0 0" fill="url(#temple30-glyph-lines)" fill-rule="evenodd" mask="url(#temple30-ambient-mask)"/><path class="temple30-pointer-light" d="M0 0" fill="url(#temple30-glyph-lines)" fill-rule="evenodd" mask="url(#temple30-pointer-mask)"/><g class="doors"><g class="door-left"><polygon class="door-panel"/><g class="temple30-door-front"><polygon class="door-bevel-lit"/><polygon class="door-bevel-shadow"/><polygon class="door-engraving"/><path class="door-line-shadow"/></g><path class="door-line"/><path class="door-handle"/><g clip-path="url(#date-clip-left)"><g class="door-date"><text class="door-date-main" x="252.5" y="239" text-anchor="middle">30</text><text class="door-date-year" x="252.5" y="282" text-anchor="middle">20</text></g></g></g><g class="door-right"><polygon class="door-panel"/><g class="temple30-door-front"><polygon class="door-bevel-lit"/><polygon class="door-bevel-shadow"/><polygon class="door-engraving"/><path class="door-line-shadow"/></g><path class="door-line"/><path class="door-handle"/><g clip-path="url(#date-clip-right)"><g class="door-date"><text class="door-date-main" x="347.5" y="239" text-anchor="middle">01</text><text class="door-date-year" x="347.5" y="282" text-anchor="middle">27</text></g></g></g></g><g class="temple-mark"><g id="winged-sun">
    <circle cx="300" cy="73" r="21"/>
